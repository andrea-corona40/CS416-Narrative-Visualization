<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>COVID-19 in Mexico | Narrative Visualization</title>
    <link rel="stylesheet" href="css/style.css">
    <script src='https://d3js.org/d3.v5.min.js'></script>
</head>
<body>
    <script src='js/main.js' defer></script>
    <div id="container">
         <div id="title-container">
            <h1>How vaccinations changed the course of the COVID-19 pandemic in Mexico?</h1>
            <h2>Follow Mexico's journey from the first COVID-19 wave through the nationwide vaccination campaign and explore how the pandemic evolved over time.</h2>
        </div>

        <div id="navigation-bar">
            <button id="previous" disabled>
                    ← Previous
                </button>

                <div id="scene-indicator">
                    <span class="dot active"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                    <span class="dot"></span>
                </div>

                <button id="next">
                    Next →
                </button>

        </div>

        <div id="story-container">
            <div id="panel">
                <div id="filter-country"> 
                    <label for="country">Filter by Country:</label>
                </div>
                <div id="story-text-container">
                    <h3 id="scene-title"></h3>
                    <p id="scene-description"></p>
                </div>

            </div>
            
            <div id="chart">
                <svg></svg>
            </div>

        </div>

    </div>

</body>
</html>
